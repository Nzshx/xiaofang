<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>消防安全隐患智能分析系统 | Fire Safety Hazard Intelligence</title>
  <link rel="icon" href="static/slogo.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --brand:#0093dd; --brand-600:#0777b4; --bg:linear-gradient(180deg,#f7fbff 0%, #f2f6fb 100%);
      --card:#ffffff; --text:#0b1324; --muted:#6b7280; --border:#e5e7eb; --shadow:0 14px 36px rgba(2,6,23,.10);
      --ok:#10b981; --warn:#f59e0b; --err:#ef4444; --nav-h:72px; --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%; overflow:hidden}
    body{font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif; margin:0; color:var(--text); background:var(--bg)}
    .navbar{position:fixed; inset:0 0 auto 0; height:var(--nav-h); background:#fff; box-shadow:var(--shadow); z-index:10}
    .nav-inner{max-width:1200px; margin:0 auto; display:flex; gap:14px; align-items:center; padding:10px 16px}
    .brand{display:flex; align-items:center; gap:12px}
    .brand .logo{height:38px}
    .brand .title .cn{font-size:18px; font-weight:800; color:var(--brand)}
    .brand .title .en{font-size:11px; color:var(--muted); letter-spacing:.2px}
    .status-pill{margin-left:auto; background:#ecf7ff; color:#0369a1; padding:6px 10px; border-radius:999px; font-size:12px; display:flex; align-items:center; gap:6px}
    .dot{width:8px; height:8px; background:var(--brand); border-radius:50%}
    .progress{position:absolute; left:0; right:0; bottom:0; height:3px; background:#e5e7eb}
    .bar{height:3px; width:0; background:var(--brand); transition:width .3s ease}
    .wrap{height:calc(100vh - var(--nav-h) - 3px); margin-top:calc(var(--nav-h) + 3px); max-width:1200px; padding:16px; margin-left:auto; margin-right:auto}
    .card{height:100%; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
    .card-head{flex:0 0 auto; padding:12px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between}
    .card-title{font-weight:800}
    .tools{display:flex; gap:8px}
    .btn{appearance:none; border:none; border-radius:12px; padding:10px 16px; font-weight:700; cursor:pointer; background:linear-gradient(180deg,var(--brand) 0%, var(--brand-600) 100%); color:#fff; box-shadow:0 6px 16px rgba(0,147,221,.24); transition:transform .06s ease, box-shadow .2s ease}
    .btn:hover{transform:translateY(-1px); box-shadow:0 10px 22px rgba(0,147,221,.28)}
    .btn.ghost{background:#fff; color:var(--brand); border:1px solid var(--brand); box-shadow:none}
    .btn.ghost:hover{background:#ecf7ff}
    .btn[disabled]{opacity:.6; cursor:not-allowed}
    .card-body{flex:1 1 auto; overflow:hidden; padding:14px}
    .grid{height:100%; display:grid; grid-template-columns: minmax(0,1fr) 520px; gap:16px}
    .grid > *{min-height:0}
    @media (max-width: 1100px){.grid{grid-template-columns: minmax(0,1fr) 480px}}
    @media (max-width: 960px){.grid{grid-template-columns:1fr}}
    .panel-left{min-height:0; display:flex; flex-direction:column}
    .control-row{flex:0 0 auto; display:flex; gap:10px; align-items:center; margin-top:10px}
    .fileinfo{font-size:12px; color:var(--muted)}
    .drop{flex:1 1 auto; display:flex; align-items:center; justify-content:center; border:2px dashed #bfe6fb; border-radius:14px; background:linear-gradient(180deg,#f8fcff 0%,#f4f9ff 100%); color:#5c86a3; text-align:center; padding:12px; overflow:hidden; position:relative}
    .drop.drag{border-color:var(--brand); box-shadow:inset 0 0 0 2px rgba(0,147,221,.15)}
    .drop img{width:100%; height:100%; object-fit:contain; display:block}
    .report{height:100%; min-height:0; border:1px solid var(--border); border-radius:14px; background:#f8fafc; display:grid; grid-template-rows:auto minmax(0,1fr); overflow:hidden}
    .report .hd{padding:12px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:#f8fafc; z-index:1}
    .report .bd{padding:14px; overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; line-height:1.6}
    .report .bd::-webkit-scrollbar{width:10px}
    .report .bd::-webkit-scrollbar-thumb{background:#b7c6ff; border-radius:999px}
    .report .bd::-webkit-scrollbar-track{background:#eef2ff}
    .skeleton{background:linear-gradient(90deg, #eef1f6 25%, #f7f9fc 37%, #eef1f6 63%); background-size:400% 100%; animation:shimmer 1.2s ease-in-out infinite}
    @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
    .sk-line{height:12px; border-radius:6px; margin:8px 0}
    .badge{display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:800}
    .low{background:#e0f7f1; color:#047857}
    .mid{background:#fff7e6; color:#92400e}
    .high{background:#fee2e2; color:#991b1b}
    .toast{position:fixed; right:18px; bottom:18px; background:#111827; color:#fff; padding:12px 14px; border-radius:10px; box-shadow:var(--shadow); opacity:0; transform:translateY(8px); transition:all .2s ease}
    .toast.show{opacity:1; transform:translateY(0)}
    @media print{
      html,body{overflow:visible !important; background:#fff}
      .navbar,.tools,.toast{display:none !important}
      .wrap{height:auto !important; margin:0 !important; padding:0 !important}
      .card{box-shadow:none !important; border:none !important}
      .card-body{padding:0 !important}
      .grid{grid-template-columns:1fr !important; gap:14px}
      .drop{display:block !important; border:none !important; background:#fff !important}
      .drop img{display:block !important; width:100% !important; height:auto !important; object-fit:contain !important}
      .report{border:none !important}
      .report .hd{position:static !important}
      .report .bd{overflow:visible !important}
      .badge{filter:none}
      @page{margin:16mm}
    }
    .thumbs{display:flex; gap:8px; flex-wrap:wrap}
    .thumbs a{display:inline-block; border:1px solid var(--border); background:#fff; border-radius:10px; padding:4px}
    .thumbs img{width:90px; height:72px; object-fit:cover; border-radius:6px; display:block}
    .kv{margin:4px 0}
    .kv code{background:#eef2ff; padding:1px 6px; border-radius:6px}
    .sect{margin-bottom:18px}
    .sect h3{margin:8px 0 8px 0}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace}
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <div class="brand">
        <img src="static/logo.png" alt="logo" class="logo" />
        <div class="title">
          <div class="cn">消防安全隐患智能分析系统</div>
          <div class="en">FIRE SAFETY HAZARD INTELLIGENCE</div>
        </div>
      </div>
      <div id="pill" class="status-pill"><span class="dot"></span><span>就绪</span></div>
    </div>
    <div class="progress"><div id="bar" class="bar"></div></div>
  </nav>

  <main class="wrap">
    <section class="card">
      <div class="card-head">
        <div class="card-title">消防安全隐患智能分析</div>
        <div class="tools">
          <button id="copyBtn" class="btn ghost" type="button">复制报告</button>
          <button id="printBtn" class="btn ghost" type="button">打印/导出PDF</button>
        </div>
      </div>
      <div class="card-body">
        <div class="grid">
          <div class="panel-left">
            <div id="drop" class="drop">拖拽图片至此或点击下方“选择图片”</div>
            <div class="control-row">
              <input type="file" id="fileInput" name="image" accept="image/*" hidden />
              <button id="chooseBtn" class="btn" type="button">选择图片</button>
              <button id="submitBtn" class="btn" type="button">上传并分析</button>
              <span id="fileInfo" class="fileinfo">未选择文件</span>
            </div>
          </div>

          <div class="report" id="reportWrap" style="display:none">
            <div class="hd">
              <strong>分析报告</strong>
              <span id="riskFlag" class="badge" style="display:none"></span>
            </div>
            <div class="bd" id="reportBody"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast">已复制到剪贴板</div>

  <script>
    // === 可选：如果前后端不在同源，请把 API_BASE 改为 'http://localhost:8000'
    const API_BASE = '';
    const API_URL  = API_BASE + '/analyze/fire-safety/guess-types';

    const fileInput = document.getElementById('fileInput');
    const chooseBtn = document.getElementById('chooseBtn');
    const submitBtn = document.getElementById('submitBtn');
    const fileInfo  = document.getElementById('fileInfo');
    const drop      = document.getElementById('drop');
    const reportWrap= document.getElementById('reportWrap');
    const reportBody= document.getElementById('reportBody');
    const riskFlag  = document.getElementById('riskFlag');
    const toast     = document.getElementById('toast');
    const bar       = document.getElementById('bar');
    const pill      = document.getElementById('pill');

    chooseBtn.addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', ()=>{
      if(!fileInput.files.length) return;
      const f = fileInput.files[0];
      fileInfo.textContent = `${f.name} · ${(f.size/1024).toFixed(1)} KB`;
      showPreviewInDrop(f);
      reportWrap.style.display = 'none';
      reportBody.innerHTML = '';
    });

    ['dragenter','dragover'].forEach(ev=> drop.addEventListener(ev, e=>{e.preventDefault(); drop.classList.add('drag')}));
    ['dragleave','drop'].forEach(ev=> drop.addEventListener(ev, e=>{e.preventDefault(); drop.classList.remove('drag')}));
    drop.addEventListener('drop', e=>{
      const files = e.dataTransfer.files; if(!files?.length) return;
      fileInput.files = files; fileInput.dispatchEvent(new Event('change'));
    });

    submitBtn.addEventListener('click', async ()=>{
      if(!fileInput.files.length){ toastShow('请先选择图片'); return; }
      const f = fileInput.files[0];
      const fd = new FormData(); fd.append('image', f);

      setWorking(true);
      reportWrap.style.display = 'grid';
      reportBody.innerHTML = skeleton();

      console.log('[UI] 提交到接口：', API_URL);
      const controller = new AbortController(); const to = setTimeout(()=> controller.abort(), 300000);

      try{
        const res = await fetch(API_URL, { method:'POST', body: fd, signal: controller.signal });
        clearTimeout(to);
        if(!res.ok) throw new Error(await res.text());
        const data = await res.json();
        console.log('[UI] 后端返回：', data);

        renderReport(data);
        setRiskBadgeByCount(data?.final_result?.hazard_count || 0);
      }catch(err){
        console.error('[UI] 调用失败：', err);
        reportBody.innerHTML = err.name==='AbortError'
          ? '⏱️ 请求超时：请重试或压缩图片。'
          : `❌ 发生错误：${escapeHtml(err.message||err)}`;
        riskFlag.style.display='none';
      }finally{
        setWorking(false);
      }
    });

    document.getElementById('copyBtn').addEventListener('click', async ()=>{
      const txt = stripHtml(reportBody.innerHTML);
      try{ await navigator.clipboard.writeText(txt); toastShow('已复制到剪贴板'); }catch{ toastShow('复制失败，请手动复制'); }
    });
    document.getElementById('printBtn').addEventListener('click', ()=> window.print());

    function showPreviewInDrop(file){
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      img.alt = '预览图';
      img.onload = ()=> URL.revokeObjectURL(img.src);
      drop.innerHTML = '';
      drop.appendChild(img);
    }
    function setWorking(flag){
      submitBtn.disabled = flag; chooseBtn.disabled = flag;
      pill.innerHTML = flag ? '<span class="dot"></span><span>分析中</span>' : '<span class="dot"></span><span>就绪</span>';
      bar.style.width = flag ? '80%' : '0%';
    }
    function toastShow(text){
      toast.textContent = text; toast.classList.add('show');
      setTimeout(()=> toast.classList.remove('show'), 1600);
    }
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
    function nl2br(s){ return escapeHtml(s).replace(/\n/g,'<br>'); }
    function stripHtml(h){ const tmp = document.createElement('div'); tmp.innerHTML=h; return tmp.textContent || tmp.innerText || ''; }
    function skeleton(){
      return '<div class="sk-line skeleton" style="width:70%"></div>'+
             '<div class="sk-line skeleton" style="width:92%"></div>'+
             '<div class="sk-line skeleton" style="width:88%"></div>'+
             '<div class="sk-line skeleton" style="width:80%"></div>';
    }
    function setRiskBadgeByCount(cnt){
      if(cnt<=0){ riskFlag.style.display='none'; return; }
      riskFlag.style.display='inline-block';
      if(cnt>=3){ riskFlag.textContent='高风险'; riskFlag.className='badge high'; }
      else if(cnt===2){ riskFlag.textContent='中风险'; riskFlag.className='badge mid'; }
      else { riskFlag.textContent='低风险'; riskFlag.className='badge low'; }
    }

    function renderReport(data){
      const { image_key, image_url, hazard_types=[], kb_results=[], final_result={} } = data || {};
      const { hazard_count=0, hazards=[] } = final_result;

      // ---- Section 0：基本信息 ----
      let html = '';
      html += `<div class="sect"><h3>基本信息</h3>
                <div class="kv">图片 Key：<code class="mono">${escapeHtml(image_key||'-')}</code></div>
                <div class="kv">临时预览：${image_url ? `<a href="${escapeHtml(image_url)}" target="_blank">打开</a>` : '-'}</div>
              </div>`;

      // ---- Section 1：候选隐患类型（Step1）----
      html += `<div class="sect"><h3>候选隐患类型（Step1）</h3>`;
      if(hazard_types.length===0){
        html += `<div>未识别到候选类型。</div>`;
      }else{
        html += `<ol>`;
        for(const t of hazard_types){
          html += `<li><code class="mono">${escapeHtml(t.category1||'')}</code> - <code class="mono">${escapeHtml(t.category2||'')}</code></li>`;
        }
        html += `</ol>`;
      }
      html += `</div>`;

      // ---- Section 2：知识库证据（Step2，每类最多1条）----
      html += `<div class="sect"><h3>知识库证据（Step2）</h3>`;
      if(kb_results.length===0){
        html += `<div>未命中任何知识库条目。</div>`;
      }else{
        for(const item of kb_results){
          const {category1, category2, results=[]} = item;
          const hit = results[0];
          html += `<div style="margin-bottom:12px; padding:10px; border:1px solid var(--border); border-radius:10px; background:#fff">
                    <div class="kv"><strong>类型：</strong><code class="mono">${escapeHtml(category1||'')}</code> - <code class="mono">${escapeHtml(category2||'')}</code></div>
                    <div class="kv"><strong>证据文本：</strong></div>
                    <div style="margin:6px 0 10px 0">${hit ? nl2br(hit.content||'') : '（无）'}</div>`;
          const imgs = hit?.images || [];
          if(imgs.length){
            html += `<div class="kv"><strong>参考图片：</strong></div><div class="thumbs">`;
            for(const u of imgs){
              const safe = escapeHtml(u);
              html += `<a href="${safe}" target="_blank" title="KB 标准图"><img src="${safe}" alt="kb" /></a>`;
            }
            html += `</div>`;
          }
          html += `</div>`;
        }
      }
      html += `</div>`;

      // ---- Section 3：最终结论（Step3）----
      html += `<div class="sect"><h3>最终结论（Step3）</h3>`;
      if(hazard_count<=0){
        html += `<div>未发现与知识库证据一致的隐患。</div>`;
      }else{
        html += `<div>共发现 <strong>${hazard_count}</strong> 处：</div>`;
        hazards.forEach((hz, idx)=>{
          html += `<details style="margin-top:10px" open>
            <summary><strong>${idx+1}. ${escapeHtml(hz.category1||'')} - ${escapeHtml(hz.category2||'')}</strong></summary>
            <div style="padding:8px 0 0 0">
              <div class="kv"><strong>隐患点：</strong>${escapeHtml(hz.point||'-')}</div>
              <div class="kv"><strong>隐患说明：</strong>${nl2br(hz.description||'-')}</div>
              <div class="kv"><strong>对应规范条文：</strong></div>
              <ul>`;
          (hz.violations||[]).forEach(v=>{
            html += `<li><div><em>${escapeHtml(v.standard||'-')}</em></div><div>${nl2br(v.content||'')}</div></li>`;
          });
          html += `</ul>
            </div>
          </details>`;
        });
      }
      html += `</div>`;

      reportBody.innerHTML = html;
      reportWrap.style.display = 'grid';
    }
  </script>
</body>
</html>
